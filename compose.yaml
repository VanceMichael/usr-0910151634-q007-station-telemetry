services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://telemetry:telemetry@postgres:5432/stations?sslmode=disable
      CONTRACT_PATH: /etc/station-telemetry/recovery-policy.json
      SWEEP_INTERVAL_SECONDS: "10"
    volumes:
      - ./contracts:/etc/station-telemetry:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  migrate:
    image: migrate/migrate:4
    command:
      - -path=/migrations
      - -database=postgres://telemetry:telemetry@postgres:5432/stations?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: stations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d stations"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - station-data:/var/lib/postgresql/data
volumes:
  station-data:
